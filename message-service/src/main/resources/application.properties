spring.application.name=message-service

server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/message_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Needed for OutboxRelay confirmCallback
spring.rabbitmq.publisher-confirm-type=correlated

# user-service gRPC
spring.grpc.client.channel.user-service.target=static://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9090}
spring.grpc.client.channel.negotiation-type=plaintext
