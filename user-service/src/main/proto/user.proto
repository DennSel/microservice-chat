syntax = "proto3";
option java_package = "org.example.grpc";
option java_multiple_files = true;

service UserService {
  rpc GetUser (GetUserRequest)
      returns (UserResponse);
}

message GetUserRequest  {int64 user_id = 1;}
message UserResponse {
  int64  user_id = 1;
  string display_name = 2;
}